name: Build Termux Lab Real

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify AI approval lifecycle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/termux-lab-lifecycle"
          javac -d "$RUNNER_TEMP/termux-lab-lifecycle" \
            app/src/main/java/com/termux/app/TermuxLabActionLifecycle.java \
            tests/termux-lab/TestTermuxLabActionLifecycle.java
          java -cp "$RUNNER_TEMP/termux-lab-lifecycle" com.termux.app.TestTermuxLabActionLifecycle

      - name: Build Termux Lab arm64 APK
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 0.118.0-lab.8.1
          TERMUX_APK_VERSION_TAG: v0.118.0-lab.8.1-apt-android-7-debug
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug
          ls -lh app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*arm64-v8a.apk' -print -quit)"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v6
        with:
          name: Termux-Lab-Real-v0.8.1-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a.apk
          if-no-files-found: error

